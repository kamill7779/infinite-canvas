# Go 后端拆分部署（Phase 11）：web(Next 前端) + backend-api(Go, 含 WS) + backend-worker(Go) + postgres + redis + 反向代理。
# 与现有 docker-compose.yml（Next 单体）并存；切到本文件即完成 /api/* → Go 的一次性切换（Phase 10 删除 Next 后端为后续可选清理）。
#   docker compose -f docker-compose.go.yml up -d --build
#   docker compose -f docker-compose.go.yml up -d --scale backend-worker=3   # worker 独立扩容
services:
  postgres:
    image: postgres:16-alpine
    container_name: infinite-canvas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infinite_canvas
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinite_canvas"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: infinite-canvas-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 迁移一次性执行，api/worker 待其成功后再起（AutoMigrate 建表）。
  backend-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: infinite-canvas-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/infinite_canvas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
    entrypoint: ["/app/migrate"]
    restart: "no"

  backend-seed:
    image: infinite-canvas-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/infinite_canvas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
    entrypoint: ["/app/seed"]
    restart: "no"

  local-storage-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/localstore && chown -R 65532:65532 /data/localstore"]
    volumes:
      - local-storage:/data/localstore
    restart: "no"

  backend-api:
    image: infinite-canvas-backend:local
    container_name: infinite-canvas-backend-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
      local-storage-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/infinite_canvas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      LOCAL_STORAGE_DIR: /data/localstore
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    expose:
      - "8080"
    volumes:
      - local-storage:/data/localstore
    restart: unless-stopped

  backend-worker:
    image: infinite-canvas-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully
      local-storage-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/infinite_canvas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      LOCAL_STORAGE_DIR: /data/localstore
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    entrypoint: ["/app/worker"]
    volumes:
      - local-storage:/data/localstore
    restart: unless-stopped

  # Next 仅作前端；/api/* 由反代转给 Go，Next 自带的 API 路由不再接流量。
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_GENERATE_WS_URL: ${NEXT_PUBLIC_GENERATE_WS_URL:-}
    image: infinite-canvas-web:local
    container_name: infinite-canvas-web
    depends_on:
      - backend-api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: infinite-canvas-proxy
    depends_on:
      - web
      - backend-api
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-go.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  local-storage:
