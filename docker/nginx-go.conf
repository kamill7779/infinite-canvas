# 反向代理（Phase 11）：/ → Next 前端，/api/* → Go 后端，/api/generate/events → Go WebSocket。
# 供 docker-compose.go.yml 的 proxy 服务挂载到 /etc/nginx/conf.d/default.conf。
server {
    listen 80;
    server_name _;

    location = /healthz {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 生成事件：必须透传 Upgrade/Connection，长连接放大读超时。
    location = /api/generate/events {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 其余 API → Go 后端。X-Forwarded-For 供后端取真实 IP（限流键/会话记录）。
    location /api/ {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m; # 图生图参考图 dataUrl 可能较大
    }

    # 其余 → Next 前端。
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
